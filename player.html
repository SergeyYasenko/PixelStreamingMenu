<!doctype html>
<html style="width: 100%; height: 100%">
   <head>
      <meta charset="utf-8" />
      <meta
         name="viewport"
         content="width=device-width,initial-scale=1,user-scalable=no"
      />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
         href="https://fonts.googleapis.com/css2?family=Michroma&family=Montserrat:wght@600&display=swap"
         rel="stylesheet"
      />
      <link
         rel="shortcut icon"
         href="43ef81525e6853dc.ico"
         type="image/x-icon"
      />
      <link rel="icon" type="image/png" sizes="96x96" href="images/favicon-96x96.png" />
      <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png" />
      <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png" />
      <title>Pixel Streaming</title>

      <style>
         /* Скрываем встроенное меню Pixel Streaming (settings/stats/menu controls). */
         #settingsPanel,
         #statsPanel,
         #menuPanel,
         #settingsButton,
         #statsButton,
         #menuButton,
         .settings-panel,
         .stats-panel,
         .menu-panel,
         .settings-button,
         .stats-button,
         .menu-button,
         [aria-label="Settings"],
         [aria-label="Stats"],
         [title="Settings"],
         [title="Stats"] {
            display: none !important;
            visibility: hidden !important;
            pointer-events: none !important;
         }
      </style>

      <script>
         // На случай, если UI создается динамически после загрузки player.js.
         (function () {
            const hiddenSelectors = [
               "#settingsPanel",
               "#statsPanel",
               "#menuPanel",
               "#settingsButton",
               "#statsButton",
               "#menuButton",
               ".settings-panel",
               ".stats-panel",
               ".menu-panel",
               ".settings-button",
               ".stats-button",
               ".menu-button",
               '[aria-label="Settings"]',
               '[aria-label="Stats"]',
               '[title="Settings"]',
               '[title="Stats"]',
            ];

            const hideMenu = () => {
               hiddenSelectors.forEach((selector) => {
                  document.querySelectorAll(selector).forEach((element) => {
                     element.style.display = "none";
                     element.style.visibility = "hidden";
                     element.style.pointerEvents = "none";
                  });
               });
            };

            document.addEventListener("DOMContentLoaded", hideMenu);
            window.addEventListener("load", hideMenu);
            new MutationObserver(hideMenu).observe(document.documentElement, {
               childList: true,
               subtree: true,
            });
         })();
      </script>

      <script defer="defer" src="player.js"></script>
   </head>
   <body
      style="
         width: 100vw;
         height: 100svh;
         min-height: -webkit-fill-available;
         overflow: hidden;
         overscroll-behavior: none;
         font-family: Montserrat;
         margin: 0;
      "
   ></body>
</html>
